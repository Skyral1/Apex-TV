targets:
  drift:
    auto_apply_builders: false
    builders:
      drift_dev:analyzer:
        enabled: true
        options: &drift_options
          has_separate_analyzer: true

      drift_dev:not_shared:
        enabled: true
        options: *drift_options

  $default:
    dependencies:
      - ":drift"

    builders:
      drift_dev:
        enabled: false

      mockito:mockBuilder:
        enabled: true
        generate_for:
          - test/mocks.dart